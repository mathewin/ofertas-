<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#075E54" />
  <title>Ofertas em tempo real</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="avatar" aria-hidden="true">O</div>
      <div class="header-info">
        <h1>OFERTAS</h1>
        <p id="header-status">ofertas em tempo real</p>
      </div>
      <button id="toggle-search" class="icon-button" type="button" aria-label="Buscar ofertas">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5A4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </header>

    <div id="search-bar" class="search-bar" hidden>
      <input id="search-input" type="search" placeholder="Buscar ofertas... notebook, celular, TV, fone" autocomplete="off" />
      <button id="clear-search" class="clear-button" type="button" aria-label="Limpar busca">x</button>
    </div>

    <nav class="chips" id="chips" aria-label="Categorias"></nav>

    <main class="chat" id="chat" aria-live="polite">
      <div class="day-divider"><span>Hoje</span></div>
      <div class="system-message">
        <span>Ola! Eu procuro as melhores ofertas para voce. As mensagens abaixo sao ofertas encontradas automaticamente.</span>
      </div>
      <div id="messages"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-emoji">🔎</div>
        <p>Nenhuma oferta encontrada.</p>
        <small>Tente outra busca ou aguarde a proxima captura automatica.</small>
      </div>
      <div class="load-more-wrap">
        <button id="load-more" class="load-more" type="button" hidden>Carregar mais ofertas</button>
      </div>
    </main>

    <footer class="app-footer">
      <div class="typing" id="typing" hidden>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <em>capturando ofertas...</em>
      </div>
      <div class="footer-note">
        <span id="live-dot" class="live-dot"></span>
        <span id="footer-text">Atualizacao automatica ativa</span>
        <select id="sort-select" class="sort-select" aria-label="Ordenar">
          <option value="recent">Recentes</option>
          <option value="discount">Maior desconto</option>
          <option value="price">Menor preco</option>
        </select>
      </div>
    </footer>
  </div>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
